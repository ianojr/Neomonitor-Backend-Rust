[package]
name = "neomonitor"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.38.4"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Performance", "Win32_Foundation", "Win32_Graphics_Dxgi"] }
wmi = "0.18.4"
